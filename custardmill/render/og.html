<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Montserrat:wght@600;700&display=block">
<style>
/* 1200x630 link preview: their lit sign (traced logo, rendered by assets.mjs) + their own words. Brand colours only:
   navy #164576, taupe #978571, custard #f6f5f1, night #0b2645 */
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#f6f5f1;font-family:'Montserrat',sans-serif;color:#164576;position:relative}
.dusk{position:absolute;left:592px;top:-21px;width:672px;height:672px;border-radius:50%;background:radial-gradient(closest-side,#0f3058 0,#0b2645 62%,#09203b 100%)}
.rays{position:absolute;left:592px;top:-21px;width:672px;height:672px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,214,160,.10) 0 1.4deg,rgba(255,214,160,0) 1.4deg 9deg);-webkit-mask:radial-gradient(closest-side,transparent 60%,#000 72%,transparent 100%)}
.sign{position:absolute;left:643px;top:30px;width:570px;height:570px}
.copy{position:absolute;left:60px;top:64px;width:515px}
.chip{display:inline-flex;align-items:center;gap:12px;height:44px;padding:0 20px;border-radius:999px;background:#fff;box-shadow:0 2px 0 rgba(151,133,113,.3);font:700 21px/1 'Montserrat';letter-spacing:.05em;color:#6b5d4b;text-transform:uppercase}
.chip i{width:13px;height:13px;border-radius:50%;background:#e39a3c}
h1{font:700 72px/.98 'Barlow Condensed';text-transform:uppercase;margin:34px 0 22px;letter-spacing:.005em}
p{font:600 25px/1.4 'Montserrat';color:#2e4a6a}
.foot{position:absolute;left:64px;bottom:58px;font:700 22px/1 'Montserrat';color:#6b5d4b;letter-spacing:.02em}
.foot b{color:#164576}
</style></head>
<body>
<div class="dusk"></div><div class="rays"></div>
<img class="sign" src="sign-lit.png" alt="">
<div class="copy">
  <div class="chip"><i></i>Coming soon · Dearborn, MI</div>
  <h1>Good days are made at the Mill.</h1>
  <p>Frozen custard, Mills and shakes. Build your first Mill for opening day.</p>
</div>
<div class="foot"><b>@custardmill</b> · custardmill.vercel.app</div>
</body></html>
