<title>Barbar Subs · TV menu</title>
<style>
/* Barbar Subs TV menu: four portrait screens (1080 x 1920), one per TV, rendered to looping MP4s for a USB stick.
   ?tv=1..4 picks the screen; ?t=12 starts the live preview at 12 s. Everything that moves is a function of t (0..LOOP)
   in render(), so render.js steps frames exactly and the last frame flows into the first.
   The 60 s loop:
   0-3 s    a red curtain; their badge builds itself (plate pops, ring draws, chef stamps on, BARBAR drops in), the
            curtain lifts on a checkered edge, the badge flies into the corner and the menu cascades in: title letter
            by letter, rows sliding in, prices rolling into place like a scoreboard.
   3-57 s   their chef (cut from the badge into a puppet rig with elbow, wrist, neck and hat-brim pivots; hat and
            mustache trail behind his head) pops up behind the counter bar, waves, flips his hat, shows off the
            screen's food, tosses it, winks, says "Stay crispy!", dances, pops up big at the bottom, peeks in from the
            left corner, comes back, laughs, backflips his hat. A red highlight glides down the menu item by item.
   57-60 s  he ducks, the curtain drops back down, ready for the next loop.
   Prices are word for word from barbarsub.com/menu. */
@font-face{font-family:'Rubik';src:url(media/rubik.woff2) format('woff2');font-weight:300 900;font-display:block}
:root{--paper:#fbf1e1;--paper2:#f3e3c7;--ink:#231f20;--muted:#6c5f55;--red:#e31e26;--red2:#b8141b;--yel:#ffcf24}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#111;height:100%;overflow:hidden}
.stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:50% 50%;background:var(--paper);color:var(--ink);font-family:'Rubik',sans-serif;overflow:hidden;font-feature-settings:"tnum" 1}
body.cap .stage{left:0;top:0;transform:none!important}

.ck{position:absolute;left:0;right:0;height:30px;background:repeating-conic-gradient(var(--red) 0 25%,var(--paper) 0 50%) 0 0/60px 60px;z-index:2}
.ck.t{top:0}.ck.b{bottom:0;z-index:9}

/* header */
.hd .bd{position:absolute;left:56px;top:46px;width:70px;z-index:3;transform-origin:50% 50%}
.hd .kick{position:absolute;left:142px;top:72px;font:800 30px/1 'Rubik';letter-spacing:.14em;text-transform:uppercase;z-index:3}
.hd .kick b{color:var(--red)}
.hd h1{position:absolute;left:52px;top:150px;font:900 104px/.86 'Rubik';letter-spacing:-.03em;text-transform:uppercase;color:var(--red);white-space:nowrap;z-index:3}
.hd h1 .ln{display:block}
.hd h1 .ch{display:inline-block;transform-origin:50% 100%}
.counter{position:absolute;left:0;right:0;top:420px;height:40px;background:var(--red);box-shadow:0 8px 0 var(--red2);z-index:6;transform-origin:0 50%}

/* the chef rig: a 1000 x 800 unit box (the badge's own coordinates), scaled into place */
.cwrap{position:absolute;left:0;top:0;width:1080px;pointer-events:none}
.cwrap.top{height:420px;z-index:5;clip-path:inset(-300px -300px 0 -300px)}
.cwrap.big{height:1802px;z-index:7;clip-path:inset(0 0 0 0)}
.cwrap.peek{height:1802px;z-index:7;clip-path:inset(0 0 0 0)}
.chef{position:absolute;left:0;top:0;width:1000px;height:800px;transform-origin:0 0}
.cg{position:absolute;left:0;top:0;width:1000px;height:800px}
.cg img{position:absolute;display:block}
.chef .item{position:absolute;left:0;top:0;width:1000px;height:800px}
.chef .item img{position:absolute;display:block}
.spark{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px}
.lids{position:absolute;left:0;top:0;width:1000px;height:800px;overflow:visible}
.shadow{filter:drop-shadow(0 18px 0 rgba(35,31,32,.12))}

/* speech bubble */
.bub{position:absolute;z-index:8;padding:16px 24px;border-radius:30px;background:#fff;border:6px solid var(--ink);font:900 38px/1 'Rubik';white-space:nowrap;text-transform:uppercase;letter-spacing:-.01em;color:var(--red);text-align:center;transform-origin:85% 100%;box-shadow:0 8px 0 rgba(35,31,32,.15)}
.bub::after{content:"";position:absolute;right:46px;bottom:-34px;width:40px;height:40px;background:#fff;border-right:6px solid var(--ink);border-bottom:6px solid var(--ink);transform:skewX(-28deg) rotate(45deg) scale(.8,1.1)}

/* menu body */
.body{position:absolute;left:56px;right:56px;top:484px;bottom:118px}
.fit{position:relative;transform-origin:0 0}
.hl{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:22px;background:var(--red);box-shadow:0 10px 0 var(--red2);z-index:0;opacity:0}
.grp{position:relative;z-index:1;margin-top:26px}
.grp:first-child{margin-top:4px}
.gh{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:12px;border-bottom:4px solid var(--ink);margin-bottom:6px}
.gh h2{font:800 46px/1 'Rubik';letter-spacing:-.01em;text-transform:uppercase}
.gh .nt{display:block;font:500 24px/1.2 'Rubik';color:var(--muted);text-transform:none;letter-spacing:0;margin-top:6px}
.tagp{display:flex;gap:10px;flex:none}
.tagp span.pill{display:flex;align-items:baseline;gap:8px;padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--paper);font:800 36px/1 'Rubik';white-space:nowrap;transform-origin:50% 50%}
.tagp small{font:600 20px/1 'Rubik';text-transform:uppercase;letter-spacing:.06em;color:var(--yel)}
.cols{display:flex;flex:none}
.cols span{width:172px;text-align:right;font:700 22px/1 'Rubik';text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row{position:relative;display:flex;align-items:center;gap:20px;padding:12px 0;min-height:76px}
.row .nm{flex:1;min-width:0}
.row b{display:flex;align-items:center;gap:12px;font:700 40px/1.05 'Rubik';letter-spacing:-.01em}
.row p{font:400 23px/1.25 'Rubik';color:var(--muted);margin-top:4px}
.row .pr{display:flex;flex:none}
.row .pr > span{width:172px;text-align:right;font:800 40px/1 'Rubik';color:var(--red);transform-origin:100% 50%}
.pair{display:flex;gap:56px;position:relative;z-index:1;margin-top:26px}
.pair > .grp{margin-top:0}
.pair > .grp{flex:1;min-width:0}
.pair .row{padding-left:14px;padding-right:14px;margin:0 -14px}
.pair .row .pr > span{width:164px}
.chili{width:34px;height:34px;color:var(--red);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:10px 12px;padding:14px 0 6px}
.chips span{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--paper2);font:700 30px/1 'Rubik'}
.chips .chili{width:26px;height:26px}
.blk{position:relative;border-radius:18px}
.blk .gh{padding-top:4px}

/* odometer digits */
.odo{display:inline-flex;align-items:baseline}
.dg{display:inline-block;height:1em;overflow:hidden;line-height:1;vertical-align:baseline;position:relative;top:.06em}
.dg i{display:block;font-style:normal;height:1em;line-height:1;text-align:center}
.dg .st{display:block}

/* ticker */
.tk{position:absolute;left:0;right:0;bottom:30px;height:88px;background:var(--ink);color:var(--paper);overflow:hidden;z-index:9}
.tk .tr{position:absolute;left:0;top:0;height:88px;display:flex;white-space:nowrap}
.tk .tr div{display:flex;align-items:center;font:700 36px/88px 'Rubik';text-transform:uppercase;letter-spacing:.02em}
.tk i{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--red);margin:0 30px}
.tk em{font-style:normal;color:var(--yel)}

/* curtain + badge build */
.curtain{position:absolute;left:0;top:-40px;width:1080px;height:1960px;background:var(--red);z-index:20}
.curtain::after{content:"";position:absolute;left:0;right:0;bottom:-36px;height:36px;background:repeating-conic-gradient(var(--red) 0 25%,var(--paper) 0 50%) 0 0/72px 72px}
.curtain::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.12),rgba(0,0,0,.18) 75%)}
.fly{position:absolute;left:0;top:0;width:1000px;height:1282px;transform-origin:0 0;z-index:21;overflow:visible}
.fly .b-sil{fill:#fff}.fly .b-ring,.fly .b-word path,.fly .b-plate,.fly .b-sub{fill:var(--red)}.fly .b-ink{fill:var(--ink)}
.fly .b-ring{stroke:var(--red);stroke-width:6}
.fly path,.fly g{transform-box:fill-box;transform-origin:50% 50%}
</style>

/* colour helpers for the highlighted row */
const mix = (a, b, k) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',')})`;
const INK = [35, 31, 32], MUT = [108, 95, 85], RED = [227, 30, 38], WHT = [255, 255, 255], PAP = [243, 227, 199];

let trW = 0, chefTop, chefBig, chefPeek;
function render(t) {
