<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#000;font-family:Poppins,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:radial-gradient(520px 340px at 300px 190px,rgba(232,240,255,.13),transparent 70%),#000}
.logo{position:absolute;left:64px;top:52px;width:500px;filter:drop-shadow(0 0 3px rgba(236,242,255,.95)) drop-shadow(0 0 14px rgba(236,242,255,.6)) drop-shadow(0 0 34px rgba(236,242,255,.35))}
.logo svg{width:100%;height:auto;display:block}
h1{position:absolute;left:66px;top:290px;width:540px;font-weight:600;font-size:40px;line-height:1.12;letter-spacing:-.02em}
h1 span{font-weight:300}
.who{position:absolute;left:66px;top:440px;font-size:24px;color:rgba(255,255,255,.72)}
.chip{position:absolute;left:66px;top:500px;display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 22px 0 16px;border-radius:999px;background:#650217;color:#f6f1ed;font-size:22px;font-weight:500;white-space:nowrap}
.chip b{font-weight:600}
.chip svg{width:20px;height:20px}
.ba{position:absolute;right:56px;top:56px;width:500px;height:518px;border-radius:28px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 30px 80px rgba(0,0,0,.8)}
.ba img{position:absolute;top:0;height:100%;width:auto;object-fit:cover}
.ba .b,.ba .a{position:absolute;top:0;bottom:0;width:50%;overflow:hidden}
.ba .b{left:0}.ba .a{right:0}
.ba .b img{left:-190px;height:518px}
.ba .a img{right:-190px;height:518px}
.ba .line{position:absolute;left:249px;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 14px #fff}
.lab{position:absolute;top:20px;padding:9px 14px;border-radius:999px;font-size:20px;font-weight:600;letter-spacing:.12em}
.lb{left:20px;background:rgba(30,26,24,.82)}
.la{right:20px;background:#fff;color:#0b0b0b}
</style></head>
<body>
<div class="bg"></div>
<div class="logo"><svg viewBox="-1 -1 442 164"><path fill="#fff" fill-rule="evenodd" d="__WMPATH__"/></svg></div>
<h1>Professional teeth whitening <span>by a Registered Dental Hygienist</span></h1>
<div class="who">Sarah Adam, RDH · Metro Detroit</div>
<div class="chip"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.5c.7 6.6 2.9 8.8 9.5 9.5v2c-6.6.7-8.8 2.9-9.5 9.5h-2C9.3 15.9 7.1 13.7.5 13v-2C7.1 10.3 9.3 8.1 10 1.5z"/></svg><span>Holiday Glo Deal: <b>$50 off</b> through Dec 31</span></div>
<div class="ba">
  <div class="b"><img src="../media/smile1-before.webp"></div>
  <div class="a"><img src="../media/smile1-after.webp"></div>
  <i class="line"></i>
  <span class="lab lb">BEFORE</span><span class="lab la">AFTER</span>
</div>
</body></html>
