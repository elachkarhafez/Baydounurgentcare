.chip svg{width:20px;height:20px}
.ba{position:absolute;right:56px;top:56px;width:500px;height:518px;border-radius:28px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 30px 80px rgba(0,0,0,.8)}

.ba .b img{left:-190px;height:518px}
.ba .a img{right:-190px;height:518px}
.ba .line{position:absolute;left:249px;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 14px #fff}
.lab{position:absolute;top:20px;padding:9px 14px;border-radius:999px;font-size:20px;font-weight:600;letter-spacing:.12em}
.lb{left:20px;background:rgba(30,26,24,.82)}
.la{right:20px;background:#fff;color:#0b0b0b}
</style></head>
