<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noai, noimageai">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{Business}} | {{Promise}}</title>
<meta name="description" content="{{One sentence a customer would search for.}}">
<meta name="theme-color" content="#0d0705">
<link rel="modulepreload" href="assets/scene.js">
<link rel="preload" href="assets/studio-512.hdr" as="fetch" crossorigin>
<!-- build3d page template. Replace {{…}}, edit CONFIG, keep the structure.
     Copy: assets/ (from kit/build3d/assets), assets/lib/ (gsap, ScrollTrigger, lenis), assets/scene.js (from build.sh). -->
<style>
:root{--bg:#0d0705;--ink:#f5ecdc;--muted:#a8968a;--line:rgba(245,236,220,.14);--accent:#c98b4b;--accent-2:#c3162b;
  --display:Georgia,serif;--sans:system-ui,sans-serif;--mono:ui-monospace,monospace;--pad:clamp(16px,4vw,56px);--ease:cubic-bezier(.2,.7,.1,1)}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:clip}html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans);overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit;color:inherit}
.mono{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:99px;padding:14px 22px;font:700 14px/1 var(--sans);text-decoration:none;cursor:pointer;transition:transform .3s var(--ease)}
.btn:hover{transform:translateY(-2px)}.btn-a{background:var(--accent-2);color:#fff}.btn-g{background:rgba(245,236,220,.08);border:1px solid var(--line)}
/* ---- the build ---- */
.build{position:relative;height:880vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:radial-gradient(120% 90% at 60% 55%,#1c0f09,var(--bg) 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;opacity:0;transition:opacity 1.4s var(--ease)}
.gl-ready #gl{opacity:1}
.no-gl .fallback{display:block}.fallback{display:none;position:absolute;inset:0}.fallback img{width:100%;height:100%;object-fit:cover;opacity:.55}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(13,7,5,.85),rgba(13,7,5,.5) 30%,transparent 56%)}
@media (max-width:820px){.shade{background:linear-gradient(0deg,rgba(13,7,5,.92),rgba(13,7,5,.55) 30%,transparent 52%)}}
.hero{position:absolute;left:var(--pad);top:50%;transform:translateY(-46%);max-width:min(560px,46vw);z-index:3}
.hero h1{font:400 clamp(46px,6.4vw,104px)/.95 var(--display);margin:18px 0 24px}
.hero p{color:#d9cbbb;max-width:430px;margin:0 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:820px){.hero{top:auto;bottom:96px;transform:none;max-width:none;right:var(--pad)}.hero h1{font-size:clamp(40px,11vw,58px)}}
.steps{position:absolute;left:var(--pad);top:50%;transform:translateY(-50%);width:min(440px,40vw);height:260px;margin:0;padding:0;list-style:none;z-index:3;pointer-events:none}
.step{position:absolute;inset:0;opacity:0;visibility:hidden}
.step .num{font:300 clamp(80px,9vw,150px)/.8 var(--display);color:transparent;-webkit-text-stroke:1px var(--accent);display:block;margin-bottom:14px}
.step h2{font:400 clamp(34px,3.6vw,58px)/1 var(--display);margin:0 0 14px}.step p{margin:0;color:#d9cbbb;max-width:360px}
@media (max-width:820px){.steps{top:auto;bottom:max(88px,12vh);transform:none;width:auto;right:var(--pad);height:auto;min-height:170px}.step{inset:auto 0 0 0}.step .num{font-size:64px}.step h2{font-size:36px}}
.rail{position:absolute;right:var(--pad);top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;gap:6px}
.rail button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:6px 0;color:rgba(245,236,220,.45);font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.rail button i{width:22px;height:2px;background:currentColor;transition:width .4s var(--ease)}.rail button.on{color:var(--ink)}.rail button.on i{width:44px;background:var(--accent)}
@media (min-width:821px) and (max-width:1180px){.rail button span{display:none}}
@media (max-width:820px){.rail{top:76px;left:var(--pad);transform:none;flex-direction:row;gap:5px}.rail button{flex:1;justify-content:center}.rail button span{display:none}.rail button i,.rail button.on i{width:100%}}
.skip{position:absolute;right:var(--pad);bottom:26px;z-index:4;background:none;border:1px solid var(--line);border-radius:99px;padding:9px 15px;cursor:pointer;color:var(--muted)}
.cue{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:3;pointer-events:none;white-space:nowrap;padding:12px 18px;border-radius:99px;background:rgba(245,236,220,.08);border:1px solid var(--line);font-weight:600;font-size:14px}
.finale{position:absolute;left:var(--pad);top:50%;transform:translateY(-50%);z-index:3;opacity:0;visibility:hidden;max-width:min(520px,44vw)}
.finale h2{font:400 clamp(70px,10vw,170px)/.85 var(--display);margin:0 0 18px}
@media (max-width:820px){.finale{top:auto;bottom:80px;transform:none;max-width:none;right:var(--pad)}.finale h2{font-size:76px}}
.rm .build{height:auto}.rm .stage{position:relative}.rm .steps,.rm .rail,.rm .skip,.rm .cue{display:none}
.after{min-height:60vh;padding:120px var(--pad)}
</style>
</head>
<body>
<main id="top">
  <section class="build" id="build" aria-label="{{What gets built}}">
    <div class="stage" id="stage">
      <canvas id="gl" role="img" aria-label="{{Alt text for the 3D build}}"></canvas>
      <div class="fallback"><img src="img/hero.jpg" alt=""></div>
      <div class="shade"></div>
      <div class="hero" id="heroCopy"><div class="mono">{{Kicker}}</div><h1>{{Headline}}</h1><p>{{Sub}}</p><div class="cta"><a class="btn btn-a" href="#after">{{Main CTA}}</a></div></div>
      <ol class="steps" id="steps" aria-live="polite"></ol>
      <div class="finale" id="finale"><h2>{{Payoff}}</h2><div class="cta"><a class="btn btn-a" href="#after">{{CTA}}</a><button class="btn btn-g" type="button" id="rebuild">Build it again</button></div></div>
      <nav class="rail" id="rail" aria-label="Build steps"></nav>
      <button class="skip mono" id="skip" type="button">Skip</button>
      <div class="cue" id="cue" aria-hidden="true">Scroll to build it</div>
    </div>
  </section>
  <section class="after" id="after"><!-- rest of the site --></section>
</main>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lib/ScrollTrigger.min.js"></script>
<script src="assets/lib/lenis.min.js"></script>
<script src="assets/lib/gate.js"></script>
<script>
const CONFIG = {
  // one entry per layer, in build order; stepAt = scroll progress where its caption is centred.
  // Keep stepAt[i] - .06 ≈ the layer's trigger in scene.js so the caption and the drop line up.
  steps: [['Plate', 'The <em>plate.</em>', 'Short line.'], ['Brownie', 'The <em>brownie.</em>', 'Short line.'], ['Ice cream', 'The <em>ice cream.</em>', 'Short line.'], ['Fudge', 'Hot <em>fudge.</em>', 'Short line.'], ['Sprinkles', 'The <em>sprinkles.</em>', 'Short line.'], ['Cherry', 'A cherry <em>on top.</em>', 'Short line.']],
  stepAt: [.12, .27, .42, .54, .74, .89]
};
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches, MOBILE = matchMedia('(max-width: 820px)').matches, HAS_G = typeof gsap !== 'undefined';
if (RM) document.documentElement.classList.add('rm');
window.__ffReady = () => { document.documentElement.classList.add('gl-ready'); window.__kitSync && window.__kitSync(); };
$('#steps').innerHTML = CONFIG.steps.map((s, i) => `<li class="step"><span class="num">0${i + 1}</span><h2>${s[1]}</h2><p>${s[2]}</p></li>`).join('');
$('#rail').innerHTML = CONFIG.steps.map((s, i) => `<button type="button" aria-label="Step ${i + 1}: ${s[0]}"><span>${s[0]}</span><i></i></button>`).join('');
(() => {
  let lenis = null;
  if (!RM && typeof Lenis !== 'undefined') { lenis = new Lenis({ lerp: .085 }); if (HAS_G) { gsap.ticker.add(t => lenis.raf(t * 1000)); gsap.ticker.lagSmoothing(0); } else { const f = t => { lenis.raf(t); requestAnimationFrame(f); }; requestAnimationFrame(f); } }
  const go = y => lenis ? lenis.scrollTo(y, { duration: 1.6 }) : scrollTo({ top: y, behavior: RM ? 'auto' : 'smooth' });
  const build = $('#build'), steps = $$('.step'), rail = $$('#rail button'), AT = CONFIG.stepAt, N = AT.length;
  const yOf = p => build.offsetTop + p * (build.offsetHeight - innerHeight);
  const gate = typeof ElaGate !== 'undefined' ? ElaGate({ section: build, lenis, rate: .3 }) : { check: () => false, open() {}, arm() {} };   // hard flicks play the build forward instead of skipping it
  rail.forEach((b, i) => b.addEventListener('click', () => go(yOf(AT[i] + .015))));
  $('#skip').addEventListener('click', () => { gate.open(); go(yOf(1) + 2); }); $('#rebuild').addEventListener('click', () => { gate.arm(); go(0); });
  let cur = -2;
  const show = (el, on) => { if (HAS_G && !RM) gsap.to(el, { autoAlpha: on ? 1 : 0, y: on ? 0 : 16, duration: on ? .8 : .3, ease: 'expo.out', overwrite: true }); else { el.style.opacity = on ? 1 : 0; el.style.visibility = on ? 'visible' : 'hidden'; } };
  function ui(p) {
    let i = -1; for (let k = 0; k < N; k++) if (p >= AT[k] - .06) i = k; if (p > .935) i = N; if (p < .045) i = -1;
    if (i !== cur) { cur = i; steps.forEach((s, k) => show(s, k === i)); rail.forEach((b, k) => b.classList.toggle('on', k === i)); show($('#finale'), i === N); }
    const h = Math.max(0, 1 - p / .04); $('#heroCopy').style.opacity = h; $('#heroCopy').style.visibility = h < .01 ? 'hidden' : 'visible';
    $('#cue').style.opacity = p < .02 ? 1 : 0; $('#skip').style.opacity = p > .93 ? 0 : 1;
  }
  if (RM) return ui(1);
  const onScroll = () => { if (gate.check()) return; const r = build.getBoundingClientRect(), p = Math.min(1, Math.max(0, -r.top / (build.offsetHeight - innerHeight))); window.__build3d && window.__build3d.setProgress(p); ui(p); };
  lenis && lenis.on('scroll', onScroll); addEventListener('scroll', onScroll, { passive: true }); addEventListener('resize', onScroll); onScroll();
  window.__kitSync = onScroll;   // sync once the 3D is up
})();
</script>
<script type="module" src="assets/scene.js"></script>
</body>
</html>
