<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Open+Sans:wght@600;800&display=swap" rel="stylesheet">
<style>
/* ELEVYN link preview, 1200x630. Brand colours from their site CSS: #0B0B0C, #C49A5C, #E6C48A, #EDEAE4. */
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0B0B0C}
body{position:relative;color:#EDEAE4;font-family:'Open Sans',sans-serif;background:radial-gradient(60% 80% at 26% 30%,#1c1712 0,#0B0B0C 62%)}
.bar{position:absolute;height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(255,244,220,0),#FFF4DC 30%,#FFF4DC 80%,rgba(255,244,220,0));box-shadow:0 0 12px rgba(255,236,200,.6),0 0 30px rgba(230,196,138,.3);transform:rotate(-9deg);transform-origin:left center;opacity:.55}
.logo{position:absolute;left:34px;top:46px;width:640px}
.copy{position:absolute;left:66px;top:262px;width:600px}
h1{margin:0;font:600 50px/1.06 'Cormorant Garamond',serif}
h1 em{font-style:italic;font-weight:500;color:#E6C48A}
p{margin:16px 0 0;font:600 24px/1.35 'Open Sans',sans-serif;color:rgba(237,234,228,.8)}
.loc{position:absolute;left:66px;bottom:44px;font:800 20px/1 'Open Sans',sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#C49A5C}
.ph{position:absolute;border-radius:18px;overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,.65);border:2px solid rgba(230,196,138,.45)}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.p1{left:716px;top:44px;width:290px;height:388px}
.p2{left:930px;top:200px;width:240px;height:320px;transform:rotate(3deg)}
.chip{position:absolute;left:730px;top:470px;font:400 30px/1 'Bebas Neue',sans-serif;letter-spacing:.08em;color:#0B0B0C;background:linear-gradient(180deg,#E6C48A,#C49A5C);padding:12px 18px 9px;border-radius:12px}
</style></head><body>
<i class="bar" style="left:120px;top:30px;width:460px"></i>
<i class="bar" style="left:-30px;top:60px;width:380px"></i>
<i class="bar" style="left:430px;top:22px;width:360px;opacity:.35"></i>
<img class="logo" src="logo-lit.svg" alt="">
<div class="copy">
  <h1>Same building on Gulley Road. A <em>whole new club</em> inside.</h1>
  <p>Gym, Pilates, spa, heated pool, Kid's Club and indoor courts.</p>
</div>
<div class="loc">Dearborn, MI · Formerly the Racquet Club</div>
<div class="ph p1"><img src="../media/facade.webp" alt=""></div>
<div class="ph p2"><img src="../media/cardio-track.webp" alt=""></div>
<div class="chip">Open 5 AM to midnight weekdays</div>
</body></html>
