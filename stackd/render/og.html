<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Montserrat';font-weight:100 900;src:url(fonts/montserrat.woff2) format('woff2')}
@font-face{font-family:'Open Sans';font-weight:600;src:url(fonts/opensans.woff2) format('woff2')}
@font-face{font-family:'Yellowtail';src:url(fonts/yellowtail.woff2) format('woff2')}
@font-face{font-family:'Dancing Script';font-weight:600;src:url(fonts/dancing.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(90% 120% at 0% 0%,#fdf7ec 0%,#fbead7 70%,#fbe3ca 100%);font-family:'Open Sans';color:#1f0c03;position:relative}
.sign{position:absolute;left:46px;top:40px;width:690px;filter:drop-shadow(0 24px 30px rgba(62,12,3,.45))}
h1{position:absolute;left:52px;top:322px;width:680px;font:800 54px/1.06 'Montserrat';color:#3e0c03;letter-spacing:-.01em}
.sub{position:absolute;left:54px;top:450px;font:600 25px/1.3 'Open Sans';color:#6e4a3a}
.prices{position:absolute;left:52px;top:500px;display:flex;gap:26px;align-items:flex-end}
.prices div{text-align:center}
.prices b{display:block;font:400 54px/1 'Yellowtail';color:#914304}
.prices small{display:block;font:700 19px/1 'Montserrat';letter-spacing:.05em;color:#3e0c03;margin-top:6px}
.ph{position:absolute;background:#fff;padding:12px 12px 10px;border-radius:8px;box-shadow:0 24px 40px -20px rgba(62,12,3,.7)}
.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
.ph span{display:block;text-align:center;font:600 24px/1.2 'Dancing Script';color:#914304;padding-top:6px}
.p1{left:820px;top:30px;width:330px;transform:rotate(4deg)}
.p2{left:800px;top:322px;width:310px;transform:rotate(-5deg)}
</style></head>
<body>
<img class="sign" src="sign-lit.png" alt="">
<h1>Cheesecake bars, boxed your way</h1>
<div class="sub">Made to order in Dearborn · text 313-656-8557</div>
<div class="prices"><div><b>$5</b><small>EACH</small></div><div><b>$30</b><small>HALF DOZEN</small></div><div><b>$45</b><small>DOZEN</small></div><div><b>$80</b><small>TWO DOZEN</small></div></div>
<div class="ph p1"><img src="../media/p-box.webp" alt=""><span>from @big_hamzzzreviews</span></div>
<div class="ph p2"><img src="../media/p-tray.webp" alt=""><span>at Little Caesars Arena</span></div>
</body></html>
