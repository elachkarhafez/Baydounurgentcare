<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:radial-gradient(80% 90% at 25% 50%,#17171a,#060607);position:relative;font-family:Manrope,sans-serif;color:#ece6da}
.leds{position:absolute;inset:0}
.leds path{fill:none;stroke:#f4f6f9;stroke-width:3;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 16px rgba(255,255,255,.4))}
.logo{position:absolute;left:70px;top:44px;width:320px}
.photo{position:absolute;right:56px;top:60px;width:330px;height:420px;border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px #f4f6f9,0 0 30px rgba(255,255,255,.25)}
.photo img{width:100%;height:100%;object-fit:cover}
.col{position:absolute;left:450px;top:120px;width:330px}
h1{font:700 44px/1.1 Cinzel,serif;color:#f6f2ea;letter-spacing:.02em}
p{margin-top:18px;font:500 22px/1.4 Manrope,sans-serif;color:#a9a8ad}
.stars{margin-top:26px;font:700 22px/1 Manrope,sans-serif;color:#ece6da}
.stars span{color:#f2d27a;letter-spacing:3px;margin-right:8px}
.place{margin-top:16px;font:600 19px/1.3 Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#cfcfd3}
</style></head><body>
<svg class="leds" viewBox="0 0 1200 630"><path d="M-10 578 H500 L530 604 H1210"/><path d="M60 -10 V30 H380"/></svg>
<img class="logo" src="lockup.svg">
<div class="col"><h1>Fades, beards and hot towel shaves</h1><p>Pick your barber and book your chair online.</p><div class="stars"><span>★★★★★</span>5.0 on Booksy</div><div class="place">Commerce Township, MI</div></div>
<div class="photo"><img src="../media/hero.webp"></div>
</body></html>
