body{width:1200px;height:630px;overflow:hidden;background:#f3f9fd;font-family:'Urbanist',sans-serif;color:#091e32;position:relative}

.g{fill:#5bc5ff;filter:url(#glow)} .c{fill:#f2fbff;stroke:#9fdcff;stroke-width:5;paint-order:stroke}

.copy{position:absolute;left:520px;top:54px;width:630px}
.chip{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 18px;border-radius:999px;background:#091e32;color:#c9ecff;font:400 21px/1 'Anton';letter-spacing:.12em}
