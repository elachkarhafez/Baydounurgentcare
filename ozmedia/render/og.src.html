<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Urbanist:wght@600;700;800&display=block">
<style>
/* 1200x630 link preview: their traced OZ MEDIA lockup lit as the studio sign on their slat wall, two of their real
   episode thumbnails, their own colours (navy #091e32, sky #5bc5ff, teal #5eead4, live red #ff4a4a, wood from the set). */
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#f3f9fd;font-family:'Urbanist',sans-serif;color:#091e32;position:relative}
.wall{position:absolute;left:0;top:0;width:470px;height:630px;overflow:hidden;
  background:linear-gradient(180deg,rgba(9,30,50,.55),rgba(9,30,50,.1) 40%,rgba(9,30,50,.85)),radial-gradient(120% 55% at 50% 0%,rgba(253,187,73,.4),transparent 60%),
  repeating-linear-gradient(90deg,#120d0b 0 7px,#4a3121 7px 10px,#7e5a3f 14px,#a47c5c 21px,#8a6446 28px,#5a3e2a 35px,#120d0b 38px 45px)}
.wall::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(94,234,212,.35),transparent 12%)}
.halo{position:absolute;left:35px;top:60px;width:400px;height:480px;background:radial-gradient(closest-side,rgba(91,197,255,.45),rgba(91,197,255,.12) 60%,transparent)}
.sign{position:absolute;left:115px;top:95px;width:240px;height:341px;overflow:visible;filter:drop-shadow(0 0 16px rgba(91,197,255,.8))}
.g{fill:#5bc5ff;filter:url(#glow)} .c{fill:#f2fbff;stroke:#9fdcff;stroke-width:5;paint-order:stroke}
.sign g[transform] use{stroke-width:.6}
.onair{position:absolute;left:150px;bottom:62px;display:flex;align-items:center;gap:12px;padding:10px 18px;border-radius:8px;background:rgba(0,0,0,.5);box-shadow:0 0 0 2px rgba(255,74,74,.6),0 0 26px rgba(255,74,74,.4);font:400 26px/1 'Anton';letter-spacing:.14em;color:#ffd9d9}
.onair i{width:14px;height:14px;border-radius:50%;background:#ff4a4a;box-shadow:0 0 12px #ff4a4a}
.copy{position:absolute;left:520px;top:54px;width:630px}
.chip{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 18px;border-radius:999px;background:#091e32;color:#c9ecff;font:400 21px/1 'Anton';letter-spacing:.12em}
.chip i{width:11px;height:11px;border-radius:50%;background:#5eead4}
h1{font:800 58px/1.04 'Urbanist';letter-spacing:-.015em;margin-top:22px}
p{font:600 25px/1.3 'Urbanist';color:#3b4f63;margin-top:14px}
.eps{position:absolute;left:520px;bottom:48px;display:flex;gap:18px}
.eps img{width:306px;height:172px;object-fit:cover;border-radius:14px;box-shadow:0 12px 30px rgba(9,30,50,.22)}
</style></head><body>
<!--DEFS-->
<div class="wall"><div class="halo"></div>
<svg class="sign" viewBox="35 15 870 1235"><g class="g"><use href="#oz-s"/></g><g class="c"><use href="#p-O"/><use href="#p-Z"/><g transform="translate(21.2 1029.7) scale(7.69)"><use href="#p-M"/><use href="#p-E"/><use href="#p-D"/><use href="#p-I"/><use href="#p-A"/></g></g></svg>
<div class="onair"><i></i>ON AIR</div></div>
<div class="copy"><span class="chip"><i></i>PODCAST + MEDIA STUDIO · METRO DETROIT</span>
<h1>Metro Detroit's community podcast studio</h1>
<p>MotivateMe313, The Fantasy Guyz, and shows, ads and highlight reels for local businesses.</p></div>
<div class="eps"><img src="../media/ep/QjC9u26r04U.webp" alt=""><img src="../media/ep/CY-dlRoghYw.webp" alt=""></div>
</body></html>
