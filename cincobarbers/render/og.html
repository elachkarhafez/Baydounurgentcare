<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Arsenal:wght@400;700&family=Arsenal+SC:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#040202}
body{position:relative;background:radial-gradient(70% 90% at 24% 30%,#21170f 0,#0c0908 50%,#040202 100%);color:#F2EADD;font-family:'Arsenal',sans-serif}
.logo{position:absolute;left:70px;top:30px;width:270px;filter:drop-shadow(0 0 10px rgba(255,190,110,.55)) drop-shadow(0 0 30px rgba(255,170,90,.3))}
.copy{position:absolute;left:66px;top:352px;width:580px}
h1{margin:0;font:400 42px/1.1 'Rye',serif;letter-spacing:.01em}
h1 em{font-style:normal;color:#C79E66}
p{margin:14px 0 0;font-size:26px;line-height:1.3;color:#d9cfbf}
.loc{margin-top:16px;font:700 21px/1 'Arsenal SC',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#C79E66}
.mir{position:absolute;border-radius:22px;padding:8px;background:#0d0d0f;box-shadow:inset 0 0 0 3px #f8faff,inset 0 0 18px rgba(230,240,255,.85),0 0 30px rgba(200,220,255,.35),0 20px 40px rgba(0,0,0,.6)}
.mir img{display:block;width:100%;height:100%;object-fit:cover;border-radius:15px}
.m1{left:680px;top:70px;width:250px;height:333px}
.m2{left:910px;top:170px;width:250px;height:333px;transform:rotate(2.5deg)}
.tag{position:absolute;left:684px;top:430px;font:700 21px/1.3 'Arsenal SC',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:rgba(242,234,221,.75)}
.tag b{color:#F2EADD}
</style></head><body>
<img class="logo" src="../render/logo-traced-lit.svg" alt="">
<div class="copy">
  <h1>Fresh cuts in <em>Cinco Ranch</em></h1>
  <p>Three barbers, open 10 to 7 every day. Haircuts $40, walk-ins welcome.</p>
  <div class="loc">Westheimer Pkwy · Katy, TX</div>
</div>
<div class="mir m1"><img src="../media/cut-crop-1.webp" alt=""></div>
<div class="mir m2"><img src="../media/cut-beard-1.webp" alt=""></div>
</body></html>
