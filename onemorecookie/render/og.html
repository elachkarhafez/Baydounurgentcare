<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Karla:wght@600;700&family=Libre+Caslon+Text:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:radial-gradient(90% 90% at 25% 40%,#fbf5ea,#efe3cc);position:relative;font-family:Karla,sans-serif;color:#4a2a1c}
.photo{position:absolute;right:-30px;top:-20px;width:560px;height:670px;overflow:hidden;border-radius:0 0 0 60px;box-shadow:-20px 0 60px -30px rgba(74,42,28,.5)}
.photo img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:640px;bottom:40px;width:170px;filter:drop-shadow(0 14px 22px rgba(74,42,28,.4));transform:rotate(-8deg)}
.col{position:absolute;left:70px;top:90px;width:560px}
h1{font:400 70px/1.02 Gloock,serif;letter-spacing:-1px}
h1 em{font:italic 400 64px/1 'Libre Caslon Text',serif;color:#c58a52}
p{margin-top:24px;font:600 25px/1.4 Karla,sans-serif;color:#7d6152;width:520px}
.chip{margin-top:30px;display:inline-flex;align-items:center;gap:12px;padding:14px 22px;border-radius:999px;background:#4a2a1c;color:#fffaf2;font:700 22px/1 Karla,sans-serif}
.chip i{width:12px;height:12px;border-radius:50%;background:#c58a52;box-shadow:0 0 0 4px rgba(197,138,82,.3)}
.bite{position:absolute;right:-60px;top:-60px;width:170px;height:170px;border-radius:50%;background:#f3e9d6}
</style></head><body>
<div class="photo"><img src="../media/rack-top.webp"></div>
<div class="col"><h1>One More Cookie<br><em>just one more…</em></h1><p>Big, chewy cookies baked by Sarah.<br>Order through her Instagram stories.</p><div class="chip"><i></i>Pickup on Fridays</div></div>

</body></html>
