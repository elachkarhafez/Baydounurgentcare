<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#000001;position:relative;font-family:Montserrat,sans-serif;color:#eef1f5}
.lock{position:absolute;left:-40px;top:-35px;width:700px;height:700px;object-fit:cover;object-position:50% 40%;-webkit-mask-image:radial-gradient(closest-side,#000 70%,transparent)}
.car{position:absolute;right:0;top:0;width:620px;height:630px;object-fit:cover;object-position:60% 55%;opacity:.3;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%)}
.col{position:absolute;left:640px;top:150px;width:500px}
.k{font:400 15px/1 Michroma,sans-serif;letter-spacing:.28em;color:#c98a5a;text-transform:uppercase}
h1{margin-top:20px;font:400 40px/1.25 Michroma,sans-serif;text-transform:uppercase;letter-spacing:.02em}
h1 b{color:#c98a5a;font-weight:400}
p{margin-top:20px;font:500 22px/1.45 Montserrat,sans-serif;color:#b9c1cc}
.chip{margin-top:28px;display:inline-flex;align-items:center;gap:12px;padding:14px 22px;border-radius:999px;box-shadow:inset 0 0 0 1.5px rgba(201,138,90,.6);background:rgba(201,138,90,.12);font:600 19px/1 Montserrat,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#f0d2b8}
.chip i{width:10px;height:10px;border-radius:50%;background:#c98a5a;box-shadow:0 0 12px #c98a5a}
.col::before{content:"";position:absolute;inset:-60px -60px -60px -80px;background:radial-gradient(closest-side,rgba(0,0,1,.75),transparent);z-index:-1}
.rule{position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,#c98a5a 30%,#ffd8b0 50%,#c98a5a 70%,transparent)}
</style></head><body>
<img class="car" src="../media/hero.webp">
<img class="lock" src="../brand/lockup-3d-autosales.png">
<div class="col">
  <div class="k">Grand opening</div>
  <h1>Your next car, <b>without the runaround</b></h1>
  <p>SUVs, sedans, trucks and coupes, with financing help and trade-ins.</p>
  <div class="chip"><i></i>Opening December 14</div>
</div>
<div class="rule"></div>
</body></html>
