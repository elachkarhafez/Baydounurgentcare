<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow:wght@500;600;700&display=block" rel="stylesheet"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0b0e12;color:#fff;font-family:Barlow;overflow:hidden;position:relative}
body::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:#3f91e3;z-index:3}
.ph{position:absolute;right:0;top:0;width:560px;height:630px;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .af{clip-path:inset(33% 0 0 0)}
.ph .bd{position:absolute;left:-10px;right:-10px;top:calc(33% - 9px);height:18px;background:linear-gradient(180deg,#e9d1a6,#c9a36a 45%,#9f7842);box-shadow:0 8px 14px rgba(0,0,0,.45)}
.ph .tg{position:absolute;font:700 18px Barlow;letter-spacing:.14em;text-transform:uppercase;padding:7px 13px;border-radius:4px}
.ph .t1{left:20px;top:26px;background:rgba(11,14,18,.85)}.ph .t2{right:20px;bottom:26px;background:#3f91e3}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0b0e12 0,rgba(11,14,18,0) 18%)}
.lg{position:absolute;left:56px;top:40px;width:250px}
h1{position:absolute;left:58px;top:262px;width:560px;font:400 50px/1.08 "Russo One"}
h1 span{color:#3f91e3}
.loc{position:absolute;left:60px;top:448px;font:600 25px Barlow;color:#c7d0d8}
.tape{position:absolute;left:-20px;width:660px;bottom:42px;background:#f5cf0c;color:#111;transform:rotate(-2deg);font:400 22px "Russo One";letter-spacing:.14em;padding:9px 0 9px 70px;white-space:nowrap;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.tape b{display:inline-block;width:8px;height:8px;background:#111;transform:rotate(45deg);margin:0 16px;vertical-align:3px}
</style></head><body>
<div class="ph"><img src="../media/hero-before.webp"><img class="af" src="../media/hero-after.webp"><div class="bd"></div><span class="tg t1">Before</span><span class="tg t2">After</span></div>
<img class="lg" src="logo.png">
<h1>Cracked driveway? We tear it out and <span>pour it right.</span></h1>
<div class="loc">Dearborn Heights &amp; Wayne County · (313) 888-0346</div>
<div class="tape">LICENSED &amp; INSURED<b></b>FREE ESTIMATES</div>
</body></html>
