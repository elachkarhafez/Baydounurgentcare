<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Gilda+Display&family=Instrument+Sans:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
.c{width:1200px;height:630px;display:grid;grid-template-columns:560px 1fr;background:#faf7f2;color:#2b1b11}
.l{padding:44px 0 46px 56px;display:flex;flex-direction:column}
.l img{width:210px}
h1{margin-top:26px;font:400 50px/1.08 'Gilda Display';max-width:440px}
h1 .ar{font:700 50px/1 Amiri;color:#7a3a17}
.loc{margin-top:auto;display:flex;gap:12px}
.loc span{padding:11px 18px;border-radius:999px;border:2px solid rgba(43,27,17,.15);font:600 22px/1 'Instrument Sans'}
.loc span.o{background:#7a3a17;border-color:#7a3a17;color:#fff}
.r{position:relative;padding:30px 30px 30px 0}
.ph{position:absolute;inset:30px 30px 30px 0;border-radius:22px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ins{position:absolute;left:-46px;bottom:48px;width:200px;height:200px;border-radius:16px;overflow:hidden;border:5px solid #faf7f2;box-shadow:0 12px 30px rgba(0,0,0,.25);background:#fff}
.ins img{width:100%;height:100%;object-fit:cover}
</style></head><body><div class="c">
<div class="l"><img src="../media/logo.webp"><h1><span class="ar">مدينة</span> means city. Coffee, matcha and Yemeni coffee on Greenfield Road.</h1><div class="loc"><span class="o">Dearborn, MI</span><span>Open late</span></div></div>
<div class="r"><div class="ph"><img src="../media/hero.webp"></div><div class="ins"><img src="../media/m/brown-sugar-latte.webp"></div></div>
</div></body></html>
