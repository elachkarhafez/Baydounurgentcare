<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@1,800;1,900&family=Montserrat:wght@500;600;700;800&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* Good Riddance reels. Colours from their logo, Saira Black Italic (GOOD/RIDDANCE match) + Montserrat (JUNK REMOVAL LLC match). */
:root{--k:#050505;--o:#fb6308;--w:#f6f6f5;--g1:#323131;--g2:#5a5959;--g3:#c4c4c4;--be:#d8bb94;--br:#965e3c}
*{box-sizing:border-box}
body{margin:0;background:#777;display:flex;flex-wrap:wrap;gap:40px;padding:40px}
body.solo{padding:0;gap:0;background:none}
.post{position:relative;overflow:hidden;background:radial-gradient(900px 700px at 50% 62%,rgba(251,99,8,.22),rgba(251,99,8,0) 70%),var(--k);color:var(--w);font-family:Montserrat,sans-serif}
.reel{width:1080px;height:1920px}
.h{margin:0;font:900 italic 112px/.98 Saira,sans-serif;text-transform:uppercase;letter-spacing:.005em}
.h em{font-style:inherit;color:var(--o)}
.s{font:600 38px/1.35 Montserrat,sans-serif;color:#dcdcda;margin:0}
.abs{position:absolute}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em}
.w>span{display:inline-block}
.rule{position:absolute;height:12px;background:var(--o);box-shadow:0 0 22px rgba(251,99,8,.7)}
.foot{position:absolute;left:0;right:0;bottom:270px;display:flex;align-items:center;justify-content:center;gap:22px}
.foot svg{width:92px;height:92px}
.foot b{font:800 34px/1 Montserrat;letter-spacing:.01em}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(800px 700px at 50% 45%,rgba(251,99,8,.3),rgba(251,99,8,0) 70%),var(--k);text-align:center;padding:0 80px}
.end .badge{width:560px;height:560px;filter:drop-shadow(0 0 30px rgba(251,99,8,.55))}
.end .cta{font:900 italic 74px/1 Saira;text-transform:uppercase}
.end .cta em{font-style:inherit;color:var(--o)}
.end .hd{font:800 40px/1 Montserrat;color:var(--o)}
.end .em{font:600 32px/1 Montserrat;color:#bdbdba}
.pill{display:inline-block;background:var(--o);color:var(--k);font:900 italic 54px/1 Saira;text-transform:uppercase;padding:16px 26px 12px;border-radius:16px}
.row{display:flex;align-items:center;gap:30px;background:#141414;border-radius:28px;padding:24px 34px;box-shadow:inset 0 0 0 3px #232323;position:relative}
.row svg{width:170px;height:110px;flex:none}
.row b{font:800 48px/1.1 Montserrat}
.stamp{position:absolute;font:900 italic 96px/1 Saira;color:var(--o);border:9px solid var(--o);padding:6px 24px 0;border-radius:14px;transform:rotate(-12deg);text-transform:uppercase;box-shadow:0 0 30px rgba(251,99,8,.45);background:rgba(5,5,5,.6)}
.strike{position:absolute;left:24px;right:24px;top:50%;height:10px;margin-top:-5px;background:var(--o);transform-origin:0 50%;border-radius:5px}
.photo{position:absolute;background:center/cover no-repeat}
.paper{position:absolute;left:110px;right:110px;background:#f3ede2;color:#151515;border-radius:26px;padding:70px 64px;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:rotate(-2deg)}
.paper p{margin:0;font:800 italic 70px/1.18 Saira;text-transform:none}
.mon{font:900 italic 150px/1 Saira;color:var(--o);text-transform:uppercase}
.step{display:flex;gap:34px;align-items:center;background:#141414;border-radius:30px;padding:34px 40px;box-shadow:inset 0 0 0 3px #262626}
.step i{font:900 italic 110px/1 Saira;color:var(--o);font-style:italic;width:90px;text-align:center}
.step b{font:800 52px/1.15 Montserrat}
</style></head><body>
