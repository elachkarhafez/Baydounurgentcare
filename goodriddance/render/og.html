<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@1,900&family=Montserrat:wght@600;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#050505;font-family:Montserrat,sans-serif;color:#f6f6f5}
.c{position:relative;width:1200px;height:630px;background:radial-gradient(520px 420px at 300px 330px,rgba(251,99,8,.38),rgba(251,99,8,0) 70%),#050505}
.badge{position:absolute;left:60px;top:55px;width:520px;height:520px;filter:drop-shadow(0 0 12px rgba(251,99,8,.8)) drop-shadow(0 0 40px rgba(251,99,8,.45))}
.r{position:absolute;right:0;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center;padding-right:60px}
h1{margin:0;font:900 italic 64px/1 Saira,sans-serif;text-transform:uppercase;letter-spacing:.005em}
h1 span{color:#fb6308;display:block}
p{margin:22px 0 0;font:600 27px/1.35 Montserrat,sans-serif;color:#dcdcda}
.rule{height:8px;width:420px;background:#fb6308;margin-top:30px;clip-path:polygon(0 0,100% 0,97% 100%,0 100%);box-shadow:0 0 18px #fb6308}
.tags{display:flex;gap:12px;margin-top:26px}
.tags b{font:700 21px/1 Montserrat,sans-serif;padding:12px 18px;border-radius:12px;background:#161616;box-shadow:inset 0 0 0 2px #323131}
.tags b.o{background:#fb6308;color:#050505;box-shadow:none}
</style></head>
<body><div class="c">
<img class="badge" src="logo-traced.svg" alt="">
<div class="r">
  <h1>Good<span>Riddance</span></h1>
  <p>Load the truck, see a ballpark price, and send it over for a real quote.</p>
  <div class="rule"></div>
  <div class="tags"><b class="o">Junk removal</b><b>Get a quote</b></div>
</div>
</div></body></html>
