<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fdfefe;font-family:Montserrat,sans-serif;color:#0b1a2c}
.fascia{position:absolute;left:0;top:0;width:1200px;height:200px;background:#0b1a2c;padding:26px 60px}
.fascia::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 70% at 50% 50%,rgba(200,220,255,.22),transparent 70%)}
.fascia::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,transparent,#f8cf46,transparent)}
.sign{position:relative;width:100%;height:100%;display:block}
.sign-stack{display:none}
.sign .unlit use{fill:#1d2d47}
.sign .halo{opacity:.7}.sign .halo use{fill:#d6e4ff}
.sign .bloom{opacity:.85}.sign .bloom use,.sign .core use{fill:#fff}
.sign .glints,.sign .shine{display:none}
.copy{position:absolute;left:60px;top:236px;width:560px}
h1{margin:0;font-size:46px;line-height:1.08;font-weight:800;letter-spacing:-.01em}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,#f8cf46 62%,#f8cf46 92%,transparent 92%)}
p{margin:16px 0 0;font-size:24px;font-weight:600;color:#3f4d65;line-height:1.3}
.tags{position:absolute;left:60px;bottom:40px;display:flex;gap:10px}
.tag{font-size:22px;font-weight:800;padding:8px 16px;border-radius:10px;background:#0b1a2c;color:#fff}
.tag.r{background:#e1391f}.tag.g{background:#0d633c}
.ph{position:absolute;right:60px;top:236px;width:470px;height:300px;border-radius:18px;overflow:hidden;border:7px solid #2b3139;box-shadow:0 18px 40px -16px rgba(11,26,44,.45)}
.ph img{width:100%;height:100%;object-fit:cover}
.coins{position:absolute;right:400px;top:388px;width:200px;height:150px;border-radius:16px;overflow:hidden;border:5px solid #fff;box-shadow:0 14px 30px -12px rgba(11,26,44,.5);transform:rotate(-4deg)}
.coins img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;right:28px;top:476px;width:136px;height:136px;filter:drop-shadow(0 8px 16px rgba(11,26,44,.3))}
.loc{position:absolute;right:186px;bottom:34px;font-size:22px;font-weight:700;color:#0b1a2c}
</style></head><body>
<!--DEFS-->
<div class="fascia"><!--SIGN--></div>
<div class="copy">
  <h1>Cash for your <em>gold</em>, deals on everything else.</h1>
  <p>Gold and silver at live spot, graded coins, Entrupy-checked bags.</p>
</div>
<div class="tags"><span class="tag g">We buy gold</span><span class="tag">32555 Ford Rd · Garden City, MI</span></div>
<div class="ph"><img src="../media/storefront.webp" alt=""></div>
<div class="coins"><img src="../media/indian-gold.webp" alt=""></div>
<!--BADGE:ogb-->
</body></html>
