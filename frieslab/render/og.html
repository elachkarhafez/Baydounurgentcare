<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;800;900&family=Lalezar&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#151214;font-family:'Roboto Slab',serif;color:#fff;position:relative}
body::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#2a0c10 0 14px,#1f090c 14px 19px,#2a0c10 19px 33px);opacity:.6}
.spill{position:absolute;left:-80px;top:-60px;width:820px;height:620px;background:radial-gradient(closest-side,rgba(255,110,20,.22),rgba(240,20,30,.07) 55%,transparent)}
.sign{position:absolute;left:14px;top:40px;width:640px}
.t{position:absolute;left:660px;top:56px;width:500px}
.where{font-weight:800;font-size:24px;color:#e0932a}
h1{font-weight:900;font-size:60px;line-height:1.02;margin-top:12px;letter-spacing:-.01em}
h1 em{font-style:normal;color:#f87607}
.ar{font-family:Lalezar,sans-serif;font-size:34px;color:#ffc21a;margin-top:10px;direction:rtl;text-align:left}
.ph{position:absolute;bottom:34px;width:240px;height:180px;border:6px solid #fff;border-radius:16px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.5)}
.ph img{width:100%;height:100%;object-fit:cover}
.a{left:668px;transform:rotate(-4deg)}.b{left:930px;transform:rotate(3deg);bottom:46px}
.wa{position:absolute;left:40px;bottom:40px;font-weight:800;font-size:26px;color:#fff;background:#1fa855;border-radius:14px;padding:12px 20px}
</style></head>
<body>
<div class="spill"></div>
<img class="sign" src="sign.png" alt="">
<div class="t">
  <div class="where">Antelias · Haret Hreik · @frieslab.lb</div>
  <h1>Messy burgers and <em>loaded fries</em></h1>
  <div class="ar">حضّر بطاطاك واطلب عبر واتساب</div>
</div>
<div class="wa">Order on WhatsApp · 71 495 055</div>
<div class="ph a"><img src="../media/godfather.webp" alt=""></div>
<div class="ph b"><img src="../media/chili.webp" alt=""></div>
</body></html>
