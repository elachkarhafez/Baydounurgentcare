<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@900&family=Mulish:wght@700;800&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#141522;font-family:Mulish,sans-serif;color:#eff5f5;position:relative}
body::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 29px,rgba(0,0,0,.25) 29px 30px),repeating-linear-gradient(90deg,transparent 0 59px,rgba(0,0,0,.18) 59px 60px);opacity:.4}
.spill{position:absolute;left:-60px;top:-40px;width:720px;height:720px;background:radial-gradient(circle,rgba(255,226,80,.16),rgba(30,210,110,.05) 45%,transparent 70%)}
.sign{position:absolute;left:10px;top:12px;height:606px}
.t{position:absolute;left:590px;top:70px;width:560px}
.where{font-weight:800;font-size:24px;color:#0ff8fc}
h1{font:900 76px/.98 'Londrina Solid',sans-serif;margin-top:12px}
h1 em{font-style:normal;color:#ede81b}
p{font-weight:700;font-size:25px;line-height:1.35;color:rgba(239,245,245,.82);margin-top:16px;max-width:520px}
.ph{position:absolute;bottom:36px;width:250px;height:188px;border:6px solid #fff;border-radius:16px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.ph img{width:100%;height:100%;object-fit:cover}
.a{left:600px;transform:rotate(-4deg)}.b{left:880px;transform:rotate(3deg);bottom:46px}
</style></head>
<body>
<div class="spill"></div>
<img class="sign" src="sign.png" alt="">
<div class="t">
  <div class="where">56 Dukaan, Indore · @frieslab</div>
  <h1>Loaded fries, <em>mixed to order</em></h1>
  <p>Mix your own or pick ours, then send the order on Instagram.</p>
</div>
<div class="ph a"><img src="../media/chilli.webp" alt=""></div>
<div class="ph b"><img src="../media/salsa.webp" alt=""></div>
</body></html>
