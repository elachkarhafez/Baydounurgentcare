<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@700&family=Instrument+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#f7f3ec radial-gradient(rgba(21,16,12,.1) 1.4px,transparent 1.8px) 0 0/14px 14px;font-family:"Instrument Sans";color:#15100c;position:relative}
.logo{position:absolute;left:64px;top:38px;width:160px}
h1{position:absolute;left:60px;top:168px;font:400 104px/.9 Anton;text-transform:uppercase;letter-spacing:.005em}
h1 span{display:block}
h1 .i{padding-left:.42em}
.fill{color:transparent;-webkit-text-stroke:3px #15100c;background:linear-gradient(#f7f3ec 0 30%,#d9b48f 30% 34%,#a8764c 34% 42%,#6e4022 42% 62%,#3a2418 62%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(5px 5px 0 #15100c)}
.hand{position:absolute;left:66px;top:388px;width:620px;font:700 34px/1.1 Caveat;color:#5e3b25}
.pill{position:absolute;left:64px;top:446px;display:flex;gap:12px}
.pill span{padding:9px 16px;border:3px solid #15100c;border-radius:999px;background:#fff;font:700 18px/1 "Instrument Sans";letter-spacing:.1em;text-transform:uppercase;box-shadow:4px 4px 0 #15100c}
.pill span.b{background:#5e3b25;color:#f7f3ec}
.pol{position:absolute;padding:12px 12px 44px;background:#fff;border:3px solid #15100c;box-shadow:8px 8px 0 #15100c}
.pol img{display:block;width:100%;height:100%;object-fit:cover}
.pol i{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:700 30px/1 Caveat;font-style:normal;color:#5e3b25}
.pa{left:790px;top:48px;width:290px;height:370px;rotate:5deg;z-index:2}
.pb{left:735px;top:310px;width:190px;height:226px;rotate:-9deg;z-index:3}
.pc{left:1012px;top:300px;width:172px;height:206px;rotate:8deg;z-index:1}
.burst{position:absolute;left:655px;top:52px;width:150px;height:150px;rotate:-12deg;z-index:4}
.burst text{font:400 22px Anton;letter-spacing:.04em}
.bean{position:absolute;width:56px;opacity:.9}
.band{position:absolute;left:-20px;right:-20px;bottom:0;height:62px;background:#5e3b25;border-top:3px solid #15100c;display:flex;align-items:center;gap:22px;padding-left:64px;color:#f7f3ec;font:400 28px/1 Anton;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.band img{width:22px;filter:brightness(1.9)}
</style></head><body>
<img class="logo" src="../img/logo.webp">
<h1><span>Let's Talk</span><span class="i">Over <span class="fill" style="display:inline">Coffee.</span></span></h1>
<p class="hand">Content &amp; social media by Noor · Dearborn, MI</p>
<div class="pill"><span class="b">@_coffeetalks</span><span>Build Your Package</span></div>
<div class="pol pa"><img src="../img/cafe.webp" style="object-position:50% 45%"><i>my corner</i></div>
<div class="pol pb"><img src="../img/coffee-week.webp" style="object-position:50% 60%"><i>coffee week!</i></div>
<div class="pol pc"><img src="../img/pink-market.webp" style="object-position:50% 40%"><i>that's me</i></div>
<svg class="burst" viewBox="0 0 100 100"><polygon points="50,2 58,18 75,8 76,27 95,26 86,43 99,55 82,63 88,81 69,79 63,97 50,85 37,97 31,79 12,81 18,63 1,55 14,43 5,26 24,27 25,8 42,18" fill="#5e3b25" stroke="#15100c" stroke-width="2.5"/><text x="50" y="47" text-anchor="middle" fill="#efe2d0" font-size="13" font-family="Anton">FRESHLY</text><text x="50" y="63" text-anchor="middle" fill="#fff" font-size="13" font-family="Anton">BREWED</text></svg>
<img class="bean" src="../img/bean.webp" style="left:540px;top:64px;rotate:24deg;width:40px">
<img class="bean" src="../img/bean.webp" style="left:1120px;top:40px;rotate:-18deg;width:46px">
<div class="band"><span>Cafés</span><img src="../img/bean.webp"><span>Restaurants</span><img src="../img/bean.webp"><span>Boutiques</span><img src="../img/bean.webp"><span>Salons</span><img src="../img/bean.webp"><span>Events</span><img src="../img/bean.webp"><span>Personal Brands</span><img src="../img/bean.webp"><span>Small Businesses</span></div>
</body></html>
