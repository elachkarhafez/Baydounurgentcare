<!doctype html>
<html><head><meta charset="utf-8">
<!-- Link preview card (1200x630) for holybaklava.vercel.app. Rendered by kit/og/card.mjs to media/og.jpg.
     The sign is the site's own lit sign (render/sign-lit.png from assets.mjs), the photos are their posts, the fonts are theirs. -->
<style>
@font-face{font-family:'Playball';src:url(fonts/playball.woff2) format('woff2')}
@font-face{font-family:'Questrial';src:url(fonts/questrial.woff2) format('woff2')}
@font-face{font-family:'Libre Baskerville';font-weight:700;src:url(fonts/librebaskerville-700.woff2) format('woff2')}
@font-face{font-family:'Meow Script';src:url(fonts/meowscript.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(80% 110% at 100% 0%,#fdd0dd 0%,#feeefb 55%,#feeefb 100%);font-family:'Questrial';color:#46181a;position:relative}
.sign{position:absolute;left:40px;top:36px;width:560px;height:558px;border-radius:34px;overflow:hidden;box-shadow:0 30px 60px -34px rgba(201,63,125,.65),inset 0 0 0 1px #f2bfd6}
.sign img{position:absolute;left:-22px;top:-8px;width:604px;height:auto}
.copy{position:absolute;left:640px;top:46px;width:530px}
h1{font:400 50px/1.1 'Playball';color:#46181a}
.prices{display:flex;gap:12px;margin-top:20px}
.prices div{background:#fdd0dd;border-radius:999px;padding:11px 18px 11px 22px;display:flex;align-items:center;gap:12px;white-space:nowrap}
.prices b{font:400 23px/1.1 'Questrial'}
.prices small{display:block;font:400 15px/1 'Questrial';letter-spacing:.14em;color:#6e3f44;margin-top:4px}
.prices i{font:700 30px/1 'Libre Baskerville';font-style:normal;padding-left:12px;border-left:2px solid #f871a6}
.ph{position:absolute;top:336px;width:250px;height:212px;border-radius:22px;overflow:hidden;border:6px solid #fff;box-shadow:0 22px 40px -22px rgba(70,24,26,.7)}
.ph img{width:100%;height:100%;object-fit:cover}
.p1{left:646px;transform:rotate(-3deg)}
.p2{left:912px;transform:rotate(3deg);top:326px}
.where{margin-top:16px;font:400 22px/1.3 'Questrial';color:#6e3f44}
.where b{font-weight:400;color:#c93f7d}
</style></head>
<body>
<div class="sign"><img src="sign-lit.png" alt=""></div>
<div class="copy">
  <h1>Rolled baklava with a Nutella or Biscoff drizzle</h1>
  <p class="where">Dearborn area · build your box, DM <b>@holybaklava</b></p>
  <div class="prices"><div><span><b>Small Box</b><small>18 PIECES</small></span><i>$30</i></div><div><span><b>Large Box</b><small>32 PIECES</small></span><i>$50</i></div></div>
</div>
<div class="ph p1"><img src="../media/f-nutella.webp" alt=""></div>
<div class="ph p2"><img src="../media/f-lotus.webp" alt=""></div>
</body></html>
